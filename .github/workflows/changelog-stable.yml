name: changelog-stable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag to enrich (e.g. v0.5.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve tag and previous stable
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "error: no tag resolved" >&2
            exit 1
          fi
          PREV=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${TAG}$" \
            | head -1 || true)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG prev=$PREV"

      - name: Generate release notes via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PREV: ${{ steps.resolve.outputs.prev }}
        run: |
          set -euo pipefail
          ARGS=(-X POST "repos/${{ github.repository }}/releases/generate-notes" -f "tag_name=${TAG}")
          if [ -n "$PREV" ]; then
            ARGS+=(-f "previous_tag_name=${PREV}")
          fi
          gh api "${ARGS[@]}" -q .body > /tmp/notes.md
          echo "--- generated notes ---"
          cat /tmp/notes.md

      - name: Patch GitHub Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          REL_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" -q .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/${REL_ID}" \
            --field body=@/tmp/notes.md > /dev/null
          echo "Release body for ${TAG} updated."

      - name: Rewrite stable section in CHANGELOG.md
        run: |
          python3 .github/scripts/enrich_changelog.py \
            "${{ steps.resolve.outputs.tag }}" /tmp/notes.md CHANGELOG.md

      - name: Open PR with enriched CHANGELOG
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/changelog-stable-${{ steps.resolve.outputs.tag }}
          base: main
          title: "chore(changelog): enrich ${{ steps.resolve.outputs.tag }} with contributors"
          commit-message: "chore(changelog): enrich ${{ steps.resolve.outputs.tag }} with contributors"
          body: |
            Auto-generated by `changelog-stable` workflow.

            Rewrites the `## [${{ steps.resolve.outputs.tag }}]` section of
            `CHANGELOG.md` with the GitHub-generated release notes
            (`by @user in #PR`) and appends a `### Contributors` list.

            The GitHub Release body for `${{ steps.resolve.outputs.tag }}` has
            also been patched to match.
          labels: |
            automated
            release
          add-paths: |
            CHANGELOG.md
