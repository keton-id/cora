name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish manually, for example v0.1.3-alpha.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runner: macos-latest
          - target: x86_64-macos
            runner: macos-latest
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-latest
          - target: x86_64-windows-gnu
            runner: ubuntu-latest
          - target: aarch64-windows-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          VERSION="${TAG#v}"
          TARGET="${{ matrix.target }}"
          case "${TARGET}" in
            *-windows*)
              # Tier 1 Windows preview: ship as .zip, append -preview tag.
              TRIPLE="${TARGET%-gnu}"
              ARTIFACT="cr-${VERSION}-${TRIPLE}-preview.zip"
              (cd zig-out/bin && zip -q "${GITHUB_WORKSPACE}/${ARTIFACT}" cr.exe)
              ;;
            *)
              ARTIFACT="cr-${VERSION}-${TARGET}.tar.gz"
              tar -C zig-out/bin -czf "${ARTIFACT}" cr
              ;;
          esac
          shasum -a 256 "${ARTIFACT}" | awk '{print $1}' > "${ARTIFACT}.sha256"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cr-${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: release_tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Compute combined SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS

      - name: Determine prerelease
        id: prerelease
        run: |
          TAG="${{ steps.release_tag.outputs.value }}"
          if [[ "${TAG}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.value }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.value }}
          PRERELEASE: ${{ steps.prerelease.outputs.value }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=( dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 dist/SHA256SUMS )
          gh release upload "$TAG" \
            "${assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$TAG" --draft=false --prerelease=false --repo "$GITHUB_REPOSITORY"
          fi
