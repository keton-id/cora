name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (e.g. v0.11.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      version: ${{ steps.tag.outputs.version }}
      matrix: ${{ steps.tag.outputs.matrix }}
    steps:
      - name: Resolve and validate release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: expected a stable vX.Y.Z tag, got '$TAG'" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          MATRIX='{"include":[{"target":"aarch64-macos","runner":"macos-latest"},{"target":"x86_64-macos","runner":"macos-latest"},{"target":"x86_64-linux","runner":"ubuntu-latest"},{"target":"aarch64-linux","runner":"ubuntu-latest"},{"target":"x86_64-windows-gnu","runner":"ubuntu-latest"},{"target":"aarch64-windows-gnu","runner":"ubuntu-latest"}]}'
          {
            echo "value=$TAG"
            echo "version=$VERSION"
            echo "matrix=$MATRIX"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved stable Cora release $TAG for all six targets."

  verify-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - run: sh -n install.sh
      - run: sh tests/install_test.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  build:
    needs: [resolve, verify-installers]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dversion=${{ needs.resolve.outputs.version }}
      - name: Package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          case "${TARGET}" in
            *-windows-*)
              TRIPLE="${TARGET%-gnu}"
              ARTIFACT="cr-${VERSION}-${TRIPLE}.zip"
              (cd zig-out/bin && zip -q "${GITHUB_WORKSPACE}/${ARTIFACT}" cr.exe)
              ;;
            *)
              ARTIFACT="cr-${VERSION}-${TARGET}.tar.gz"
              tar -C zig-out/bin -czf "${ARTIFACT}" cr
              ;;
          esac
          shasum -a 256 "${ARTIFACT}" | awk '{print $1}' > "${ARTIFACT}.sha256"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cr-${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish Cora v${{ needs.resolve.outputs.version }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Compute combined SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          shasum -a 256 -- *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "Cora v${VERSION}"
          fi
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 dist/SHA256SUMS)
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --title "Cora v${VERSION}" --draft=false --prerelease=false --repo "$GITHUB_REPOSITORY"

  publish-homebrew:
    name: publish homebrew formula
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render formula
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x cora/scripts/render-homebrew.sh
          cora/scripts/render-homebrew.sh "$VERSION" dist > cora.rb
      - name: Push to keton-id/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/keton-id/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp cora.rb tap/Formula/cora.rb
          cd tap
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet -- Formula/cora.rb; then
            echo "Formula/cora.rb unchanged; skipping push."
            exit 0
          fi
          git add Formula/cora.rb
          git commit -m "cora ${VERSION}"
          git push

  publish-scoop:
    name: publish scoop manifest
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x cora/scripts/render-scoop.sh
          cora/scripts/render-scoop.sh "$VERSION" dist > cora.json
          python3 -c "import json; json.load(open('cora.json'))"
      - name: Push to keton-id/scoop-bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/keton-id/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp cora.json bucket/bucket/cora.json
          cd bucket
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet -- bucket/cora.json; then
            echo "bucket/cora.json unchanged; skipping push."
            exit 0
          fi
          git add bucket/cora.json
          git commit -m "cora ${VERSION}"
          git push

  publish-npm:
    name: publish @keton-id/cora
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      # The package installer is taken from main so a failed publish for an
      # existing vX.Y.Z tag can be retried with corrected launcher code. Its
      # manifest version still points postinstall at this run's release tag.
      - uses: actions/checkout@v4
        with:
          path: cora
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          scope: '@keton-id'
      - run: npm install --global npm@latest
      - name: Prepare single npm package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node cora/packaging/npm/scripts/prepare-package.mjs \
            --version "$VERSION" \
            --src cora/packaging/npm/meta \
            --license cora/LICENSE \
            --out npm-package
      - name: Publish @keton-id/cora with npm Trusted Publishing
        working-directory: npm-package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          PKG="@keton-id/cora@${VERSION}"
          if npm view "$PKG" version --prefer-online 2>/dev/null; then
            echo "$PKG already exists; skipping publish"
            exit 0
          fi
          npm publish --access public
