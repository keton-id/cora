name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Channel'
        type: choice
        options:
          - prerelease
          - release
        required: true
        default: prerelease
      source_tag:
        description: 'Source tag (e.g. v0.3.0-alpha.1). For release channel the suffix is stripped to derive the stable tag.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: resolve target tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Resolve tag and channel
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.release_channel }}
          INPUT_SOURCE: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$INPUT_CHANNEL"
            SOURCE="$INPUT_SOURCE"
          else
            CHANNEL=""
            SOURCE="$REF_NAME"
          fi

          if [ "$CHANNEL" = "release" ]; then
            # Strip first dash-suffix: v0.3.0-alpha.1 -> v0.3.0
            TAG="${SOURCE%%-*}"
          else
            TAG="$SOURCE"
          fi

          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} channel=${CHANNEL:-tag-push} prerelease=${PRERELEASE}"

      - name: Create stable tag at source commit
        if: ${{ inputs.release_channel == 'release' && steps.tag.outputs.value != inputs.source_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source_tag }}
          STABLE: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail

          # The /git/refs/tags/<name> endpoint does PREFIX matching: querying
          # `v0.5.0` while `v0.5.0-alpha.1` exists returns an array and confuses
          # both the SHA lookup (jq) and the existence check. Use matching-refs
          # which always returns an array, then filter by exact ref name.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$SOURCE" \
            --jq ".[] | select(.ref==\"refs/tags/$SOURCE\") | .object.sha")
          if [ -z "$SHA" ]; then
            echo "Source tag $SOURCE not found" >&2
            exit 1
          fi

          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$STABLE" \
            --jq ".[] | select(.ref==\"refs/tags/$STABLE\") | .object.sha")
          if [ -n "$EXISTING" ]; then
            echo "Stable tag $STABLE already exists at $EXISTING; skipping create."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$STABLE" -f sha="$SHA"
            echo "Created tag $STABLE -> $SHA"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-macos
            runner: macos-latest
          - target: x86_64-macos
            runner: macos-latest
          - target: x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-linux
            runner: ubuntu-latest
          - target: x86_64-windows-gnu
            runner: ubuntu-latest
          - target: aarch64-windows-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          TARGET="${{ matrix.target }}"
          case "${TARGET}" in
            *-windows*)
              # Tier 1 Windows preview: ship as .zip, append -preview tag.
              TRIPLE="${TARGET%-gnu}"
              ARTIFACT="cr-${VERSION}-${TRIPLE}-preview.zip"
              (cd zig-out/bin && zip -q "${GITHUB_WORKSPACE}/${ARTIFACT}" cr.exe)
              ;;
            *)
              ARTIFACT="cr-${VERSION}-${TARGET}.tar.gz"
              tar -C zig-out/bin -czf "${ARTIFACT}" cr
              ;;
          esac
          shasum -a 256 "${ARTIFACT}" | awk '{print $1}' > "${ARTIFACT}.sha256"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cr-${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.prerelease == 'true' && 'pre-release' || 'release' }}
    outputs:
      tag: ${{ needs.resolve.outputs.tag }}
      prerelease: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute combined SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS

      - name: Verify or create release shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Stable tag derived from a prerelease tag won't have a release-please draft.
            # Create a fresh draft so the upload step has something to clobber into.
            FLAGS=(--draft --title "$TAG")
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}"
          fi

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=( dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 dist/SHA256SUMS )
          gh release upload "$TAG" \
            "${assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$TAG" --draft=false --prerelease=false --repo "$GITHUB_REPOSITORY"
          fi

  publish-npm:
    name: publish npm package
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm tree
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          node cora/npm/scripts/prepare.mjs \
            --version "$VERSION" \
            --dist dist \
            --npm cora/npm

      - name: Pack preview (for the CI log)
        working-directory: cora/npm
        run: |
          set -euo pipefail
          npm pack --dry-run

      - name: Publish to npm
        working-directory: cora/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish --access public

  publish-homebrew:
    name: publish homebrew formula
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render formula
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          chmod +x cora/scripts/render-homebrew.sh
          cora/scripts/render-homebrew.sh "$VERSION" dist > cora.rb
          echo "Rendered Formula/cora.rb:"
          cat cora.rb

      - name: Push to keton-id/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/keton-id/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp cora.rb tap/Formula/cora.rb
          cd tap
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet -- Formula/cora.rb; then
            echo "Formula/cora.rb unchanged; skipping push."
            exit 0
          fi
          git add Formula/cora.rb
          git commit -m "cora ${VERSION}"
          git push

  publish-scoop:
    name: publish scoop manifest
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render manifest
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          chmod +x cora/scripts/render-scoop.sh
          cora/scripts/render-scoop.sh "$VERSION" dist > cora.json
          echo "Rendered bucket/cora.json:"
          cat cora.json
          python3 -c "import json,sys; json.load(open('cora.json'))"

      - name: Push to keton-id/scoop-bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/keton-id/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp cora.json bucket/bucket/cora.json
          cd bucket
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet -- bucket/cora.json; then
            echo "bucket/cora.json unchanged; skipping push."
            exit 0
          fi
          git add bucket/cora.json
          git commit -m "cora ${VERSION}"
          git push
