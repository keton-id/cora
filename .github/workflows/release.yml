name: release

on:
  push:
    tags:
      - 'cora-macos-v*'
      - 'cora-linux-v*'
      - 'cora-windows-v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Channel'
        type: choice
        options:
          - prerelease
          - release
        required: true
        default: prerelease
      source_tag:
        description: 'Source tag (e.g. cora-macos-v0.3.0-alpha.1). For release channel the suffix is stripped to derive the stable tag.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve target tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      os: ${{ steps.tag.outputs.os }}
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      matrix: ${{ steps.tag.outputs.matrix }}
      npm_matrix: ${{ steps.tag.outputs.npm_matrix }}
    steps:
      - name: Resolve tag, OS, channel
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.release_channel }}
          INPUT_SOURCE: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$INPUT_CHANNEL"
            SOURCE="$INPUT_SOURCE"
          else
            CHANNEL=""
            SOURCE="$REF_NAME"
          fi

          # Parse OS from the tag prefix: `cora-{os}-v...`.
          case "$SOURCE" in
            cora-macos-v*)   OS="macos" ;;
            cora-linux-v*)   OS="linux" ;;
            cora-windows-v*) OS="windows" ;;
            *)
              echo "error: unrecognised tag prefix in '$SOURCE' (expected cora-{macos|linux|windows}-v...)" >&2
              exit 1
              ;;
          esac

          PREFIX="cora-${OS}-v"
          SOURCE_VERSION="${SOURCE#${PREFIX}}"

          if [ "$CHANNEL" = "release" ]; then
            # Strip first dash-suffix: 0.3.0-alpha.1 -> 0.3.0
            VERSION="${SOURCE_VERSION%%-*}"
            TAG="${PREFIX}${VERSION}"
          else
            VERSION="$SOURCE_VERSION"
            TAG="$SOURCE"
          fi

          # Prerelease iff stripped version (just the semver part) contains
          # a dash — i.e. has a pre-release suffix like `-alpha.1`.
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          # Build matrix filtered to this OS only. Two flavors:
          #
          # - `matrix` (build job): one entry per Zig target. Build only
          #   needs to compile once per triple, regardless of how many
          #   npm registries we ship to afterward.
          # - `npm_matrix` (publish-npm-subpackage): cross-product of
          #   target × registry, so each (triple, registry) pair runs
          #   its own publish job. GitHub Actions can't layer a static
          #   `matrix.registry` dim on top of a dynamic include-only
          #   matrix, so we materialise the product here.
          case "$OS" in
            macos)
              MATRIX='{"include":[{"target":"aarch64-macos","runner":"macos-latest","npm_platform":"darwin","npm_arch":"arm64"},{"target":"x86_64-macos","runner":"macos-latest","npm_platform":"darwin","npm_arch":"x64"}]}'
              NPM_MATRIX='{"include":[{"target":"aarch64-macos","npm_platform":"darwin","npm_arch":"arm64","registry":"npmjs","registry_url":"https://registry.npmjs.org","token_secret":"NPM_TOKEN"},{"target":"aarch64-macos","npm_platform":"darwin","npm_arch":"arm64","registry":"github","registry_url":"https://npm.pkg.github.com","token_secret":"GITHUB_TOKEN"},{"target":"x86_64-macos","npm_platform":"darwin","npm_arch":"x64","registry":"npmjs","registry_url":"https://registry.npmjs.org","token_secret":"NPM_TOKEN"},{"target":"x86_64-macos","npm_platform":"darwin","npm_arch":"x64","registry":"github","registry_url":"https://npm.pkg.github.com","token_secret":"GITHUB_TOKEN"}]}'
              ;;
            linux)
              MATRIX='{"include":[{"target":"x86_64-linux","runner":"ubuntu-latest","npm_platform":"linux","npm_arch":"x64"},{"target":"aarch64-linux","runner":"ubuntu-latest","npm_platform":"linux","npm_arch":"arm64"}]}'
              NPM_MATRIX='{"include":[{"target":"x86_64-linux","npm_platform":"linux","npm_arch":"x64","registry":"npmjs","registry_url":"https://registry.npmjs.org","token_secret":"NPM_TOKEN"},{"target":"x86_64-linux","npm_platform":"linux","npm_arch":"x64","registry":"github","registry_url":"https://npm.pkg.github.com","token_secret":"GITHUB_TOKEN"},{"target":"aarch64-linux","npm_platform":"linux","npm_arch":"arm64","registry":"npmjs","registry_url":"https://registry.npmjs.org","token_secret":"NPM_TOKEN"},{"target":"aarch64-linux","npm_platform":"linux","npm_arch":"arm64","registry":"github","registry_url":"https://npm.pkg.github.com","token_secret":"GITHUB_TOKEN"}]}'
              ;;
            windows)
              MATRIX='{"include":[{"target":"x86_64-windows-gnu","runner":"ubuntu-latest","npm_platform":"win32","npm_arch":"x64"},{"target":"aarch64-windows-gnu","runner":"ubuntu-latest","npm_platform":"win32","npm_arch":"arm64"}]}'
              NPM_MATRIX='{"include":[{"target":"x86_64-windows-gnu","npm_platform":"win32","npm_arch":"x64","registry":"npmjs","registry_url":"https://registry.npmjs.org","token_secret":"NPM_TOKEN"},{"target":"x86_64-windows-gnu","npm_platform":"win32","npm_arch":"x64","registry":"github","registry_url":"https://npm.pkg.github.com","token_secret":"GITHUB_TOKEN"},{"target":"aarch64-windows-gnu","npm_platform":"win32","npm_arch":"arm64","registry":"npmjs","registry_url":"https://registry.npmjs.org","token_secret":"NPM_TOKEN"},{"target":"aarch64-windows-gnu","npm_platform":"win32","npm_arch":"arm64","registry":"github","registry_url":"https://npm.pkg.github.com","token_secret":"GITHUB_TOKEN"}]}'
              ;;
          esac

          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "os=${OS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "npm_matrix=${NPM_MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} os=${OS} version=${VERSION} channel=${CHANNEL:-tag-push} prerelease=${PRERELEASE}"

      - name: Create stable tag at source commit
        if: ${{ inputs.release_channel == 'release' && steps.tag.outputs.value != inputs.source_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ inputs.source_tag }}
          STABLE: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail

          # The /git/refs/tags/<name> endpoint does PREFIX matching: querying
          # `cora-macos-v0.5.0` while `cora-macos-v0.5.0-alpha.1` exists returns
          # an array and confuses both the SHA lookup (jq) and the existence
          # check. Use matching-refs which always returns an array, then
          # filter by exact ref name.
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$SOURCE" \
            --jq ".[] | select(.ref==\"refs/tags/$SOURCE\") | .object.sha")
          if [ -z "$SHA" ]; then
            echo "Source tag $SOURCE not found" >&2
            exit 1
          fi

          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$STABLE" \
            --jq ".[] | select(.ref==\"refs/tags/$STABLE\") | .object.sha")
          if [ -n "$EXISTING" ]; then
            echo "Stable tag $STABLE already exists at $EXISTING; skipping create."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$STABLE" -f sha="$SHA"
            echo "Created tag $STABLE -> $SHA"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        # Pass the tag's version through to the binary so `cr version`
        # reports the actual release, not whatever build.zig.zon happens
        # to hold at the checked-out commit (which can drift from the
        # mirror tag's release version for retags).
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dversion=${{ needs.resolve.outputs.version }}

      - name: Package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          case "${TARGET}" in
            *-windows*)
              # Windows ships as .zip (no tarball convention on Windows).
              # `${TARGET%-gnu}` strips the toolchain suffix so artifact
              # filenames stay symmetric with the POSIX triples.
              TRIPLE="${TARGET%-gnu}"
              ARTIFACT="cr-${VERSION}-${TRIPLE}.zip"
              (cd zig-out/bin && zip -q "${GITHUB_WORKSPACE}/${ARTIFACT}" cr.exe)
              ;;
            *)
              ARTIFACT="cr-${VERSION}-${TARGET}.tar.gz"
              tar -C zig-out/bin -czf "${ARTIFACT}" cr
              ;;
          esac
          shasum -a 256 "${ARTIFACT}" | awk '{print $1}' > "${ARTIFACT}.sha256"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cr-${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.prerelease == 'true' && 'pre-release' || 'release' }}
    outputs:
      tag: ${{ needs.resolve.outputs.tag }}
      os: ${{ needs.resolve.outputs.os }}
      version: ${{ needs.resolve.outputs.version }}
      prerelease: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute combined SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS

      - name: Verify or create release shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          OS: ${{ needs.resolve.outputs.os }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          TITLE="Cora ${OS} v${VERSION}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Stable tag derived from a prerelease tag won't have a release-please draft.
            # Create a fresh draft so the upload step has something to clobber into.
            FLAGS=(--draft --title "$TITLE")
            if [ "$PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}"
          fi

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=( dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 dist/SHA256SUMS )
          gh release upload "$TAG" \
            "${assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$TAG" --draft=false --prerelease=false --repo "$GITHUB_REPOSITORY"
          fi

  update-release-badges:
    name: update README release badges
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh stable and prerelease badge JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .github/badges
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 <<'PY'
          import json
          from pathlib import Path

          releases = json.loads(Path("releases.json").read_text())
          badges_dir = Path(".github/badges")
          colors = {"macos": "0db7ed", "linux": "fcc624", "windows": "00a4ef"}
          labels = {"macos": "macOS", "linux": "Linux", "windows": "Windows"}

          def latest_tag(os_name: str, prerelease: bool):
              prefix = f"cora-{os_name}-v"
              for rel in releases:
                  if rel.get("draft"):
                      continue
                  if rel.get("prerelease") != prerelease:
                      continue
                  tag = rel.get("tag_name", "")
                  if tag.startswith(prefix):
                      return tag[len(f"cora-{os_name}-") :]
              return None

          for os_name in ("macos", "linux", "windows"):
              for channel, is_prerelease in (("stable", False), ("prerelease", True)):
                  message = latest_tag(os_name, is_prerelease) or "not yet"
                  color = colors[os_name] if message != "not yet" else "9f9f9f"
                  payload = {
                      "schemaVersion": 1,
                      "label": labels[os_name],
                      "message": message,
                      "color": color,
                  }
                  (badges_dir / f"{channel}-{os_name}.json").write_text(
                      json.dumps(payload, indent=2) + "\n"
                  )
          PY

      - name: Commit updated badges
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/badges; then
            echo "Badges unchanged; skipping commit."
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add .github/badges
          git commit -m "docs: refresh release badges"
          git push

  publish-homebrew:
    name: publish homebrew formula
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.os == 'macos' && needs.resolve.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render formula
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x cora/scripts/render-homebrew.sh
          cora/scripts/render-homebrew.sh "$VERSION" dist > cora.rb
          echo "Rendered Formula/cora.rb:"
          cat cora.rb

      - name: Push to keton-id/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/keton-id/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp cora.rb tap/Formula/cora.rb
          cd tap
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet -- Formula/cora.rb; then
            echo "Formula/cora.rb unchanged; skipping push."
            exit 0
          fi
          git add Formula/cora.rb
          git commit -m "cora ${VERSION}"
          git push

  publish-scoop:
    name: publish scoop manifest
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.os == 'windows' && needs.resolve.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x cora/scripts/render-scoop.sh
          cora/scripts/render-scoop.sh "$VERSION" dist > cora.json
          echo "Rendered bucket/cora.json:"
          cat cora.json
          python3 -c "import json,sys; json.load(open('cora.json'))"

      - name: Push to keton-id/scoop-bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/keton-id/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp cora.json bucket/bucket/cora.json
          cd bucket
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet -- bucket/cora.json; then
            echo "bucket/cora.json unchanged; skipping push."
            exit 0
          fi
          git add bucket/cora.json
          git commit -m "cora ${VERSION}"
          git push

  publish-linux:
    name: publish linux (stub)
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.os == 'linux' && needs.resolve.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          # TODO(linux-dist): wire AUR and/or snapcraft publish steps here
          # once an account + signing key are provisioned. Until then,
          # Linux users consume the GitHub release tarballs directly.
          echo "Linux stable release ${{ needs.resolve.outputs.version }}: no package-manager publish step configured yet."

  publish-npm-subpackage:
    name: publish npm subpackage ${{ matrix.target }} → ${{ matrix.registry }}
    needs: [resolve, publish]
    if: ${{ needs.resolve.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    # `packages: write` is the permission GitHub Packages checks against
    # the workflow's GITHUB_TOKEN; npmjs publishes use NPM_TOKEN and
    # don't care about it, but the cross-product matrix means both
    # registries share the job spec.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.npm_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: cr-${{ matrix.target }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # `registry-url` only wires `_authToken` for the registry's
          # host into ~/.npmrc — it does NOT switch the default publish
          # target. We pass `--registry` explicitly on every npm call,
          # so an auth row keyed to the right host is still required.
          registry-url: ${{ matrix.registry_url }}
          # GitHub Packages requires the scope to match the host's
          # auth namespace; npmjs ignores `scope` for public packages
          # but the duplication is harmless.
          scope: '@keton-id'

      - name: Prepare subpackage tree
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          NPM_PLATFORM: ${{ matrix.npm_platform }}
          NPM_ARCH: ${{ matrix.npm_arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          node cora/packaging/npm/scripts/prepare-subpackage.mjs \
            --version "$VERSION" \
            --platform "$NPM_PLATFORM" \
            --arch "$NPM_ARCH" \
            --target "$TARGET" \
            --dist dist \
            --out subpackage

      - name: Publish subpackage (idempotent)
        working-directory: subpackage
        env:
          # `secrets[<name>]` indirection lets the matrix pick the right
          # token per registry without duplicating the publish step.
          NODE_AUTH_TOKEN: ${{ secrets[matrix.token_secret] }}
          REGISTRY_URL: ${{ matrix.registry_url }}
          VERSION: ${{ needs.resolve.outputs.version }}
          NPM_PLATFORM: ${{ matrix.npm_platform }}
          NPM_ARCH: ${{ matrix.npm_arch }}
        run: |
          set -euo pipefail
          PKG="@keton-id/cora-${NPM_PLATFORM}-${NPM_ARCH}"

          # Idempotent retry: if the exact <pkg>@<version> already exists
          # on this registry, skip publish (a previous workflow run for
          # the same tag already won). npm view exits non-zero on 404,
          # which is the "go publish" signal — anything else (network,
          # 5xx) we want to surface, so we capture stderr separately.
          if npm view "${PKG}@${VERSION}" version --registry="${REGISTRY_URL}" > /dev/null 2>view.err; then
            echo "${PKG}@${VERSION} already on ${REGISTRY_URL} — skipping publish"
            exit 0
          fi
          if ! grep -qE 'E404|404 Not Found|not in this registry|is not in this registry' view.err; then
            echo "npm view failed with a non-404 error — refusing to publish blind" >&2
            cat view.err >&2
            exit 1
          fi

          npm publish --access public --registry="${REGISTRY_URL}"

  publish-npm-meta:
    name: publish npm meta → ${{ matrix.registry }}
    needs: [resolve, publish, publish-npm-subpackage]
    if: ${{ needs.resolve.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Keep registries independent: a transient failure on GitHub
      # Packages shouldn't block the npmjs publish (or vice versa).
      fail-fast: false
      matrix:
        include:
          - registry: npmjs
            registry_url: https://registry.npmjs.org
            token_secret: NPM_TOKEN
          - registry: github
            registry_url: https://npm.pkg.github.com
            token_secret: GITHUB_TOKEN
    # Queue meta publishes per registry so two concurrent OS releases
    # can't race a non-monotonic version onto the same registry. Keep
    # the groups distinct so a slow npmjs publish doesn't gate the GH
    # Packages job — each registry has its own bump-on-conflict loop.
    concurrency:
      group: npm-meta-${{ matrix.registry }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: cora
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: ${{ matrix.registry_url }}
          scope: '@keton-id'

      - name: Prepare + publish meta
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets[matrix.token_secret] }}
          REGISTRY_URL: ${{ matrix.registry_url }}
        run: |
          set -euo pipefail
          # prepare-meta.mjs queries the target registry for each
          # subpackage's current dist-tag `latest`, renders the meta
          # tree with version = release semver, and publishes — with a
          # bump-on-conflict loop that absorbs the multi-OS race
          # (three mirror tags at the same version → three parallel
          # meta publishes at the same name@version). The first wins,
          # the others either no-op (identical pins → idempotent
          # success) or bump the patch and republish (different pins).
          # The --registry flag scopes every `npm view` and `npm
          # publish` inside the script to one registry, so the npmjs
          # and GitHub Packages runs each settle on their own version.
          node cora/packaging/npm/scripts/prepare-meta.mjs \
            --version "$VERSION" \
            --src cora/packaging/npm/meta \
            --out meta \
            --registry "$REGISTRY_URL"
